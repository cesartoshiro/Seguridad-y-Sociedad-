(function(){

  const pad=n=&gt;String(n).padStart(2,&#x27;0&#x27;);

  }
  function go(n){
    i=Math.max(0,Math.min(slides.length-1,n));
    slides.forEach((s,k)=&gt;s.classList.toggle(&#x27;active&#x27;,k===i));
    count.textContent=pad(i+1)+&#x27; / &#x27;+pad(slides.length);
    bar.style.width=((i+1)/slides.length*100)+&#x27;%&#x27;;
    try{history.replaceState(null,&#x27;&#x27;,&#x27;#&#x27;+(i+1));}catch(e){}
    document.getElementById(&#x27;gocft&#x27;).classList.toggle(&#x27;show&#x27;, i===slides.length-1 &amp;&amp; window.parent!==window);

  document.getElementById(&#x27;next&#x27;).onclick=()=&gt;go(i+1);
  document.addEventListener(&#x27;keydown&#x27;,e=&gt;{
    const inForm=e.target.closest &amp;&amp; e.target.closest(&#x27;input,label,textarea,button&#x27;);
    if([&#x27;ArrowRight&#x27;,&#x27;PageDown&#x27;].includes(e.key) || (e.key===&#x27; &#x27; &amp;&amp; !inForm)){e.preventDefault();go(i+1);}
    else if([&#x27;ArrowLeft&#x27;,&#x27;PageUp&#x27;].includes(e.key)){e.preventDefault();go(i-1);}

  const h=parseInt((location.hash||&#x27;&#x27;).slice(1),10);
  go(isNaN(h)?0:h-1);
})();

const ROOM = [{&quot;id&quot;:&quot;t1&quot;,&quot;color&quot;:&quot;#2dd4bf&quot;,&quot;title&quot;:&quot;Briefing: tu primer día en la Unidad de Privacidad&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;Bienvenido/a a la &lt;strong&gt;Unidad de Protección de Datos de la Municipalidad de Valle Verde&lt;/strong&gt; (institución ficticia). La alcaldía te encargó revisar si la institución cumple la normativa costarricense de protección de datos y apoyar la respuesta a un incidente reciente.&lt;/p&gt;\n  &lt;p&gt;En cada tarea vas a encontrar evidencias —un expediente, dos datasets, una pantalla de registro, una bitácora y una auditoría personal— y preguntas que debes responder aplicando lo visto en la Semana 11.&lt;/p&gt;\n  &lt;div class=\&quot;box\&quot;&gt;&lt;h4 style=\&quot;margin-top:0\&quot;&gt;Reglas de la sala&lt;/h4&gt;\n  &lt;p style=\&quot;margin:0\&quot;&gt;• Todo el material es &lt;strong&gt;ficticio&lt;/strong&gt; y tiene fines educativos.&lt;br&gt;• No necesitas atacar ni escanear ningún sistema: el reto es &lt;strong&gt;analizar, clasificar y aplicar la ley&lt;/strong&gt;.&lt;br&gt;• Las flags tienen el formato &lt;code&gt;PRIV{...}&lt;/code&gt;. Las demás respuestas no distinguen mayúsculas ni tildes.&lt;br&gt;• Si te atascas, usa el botón &lt;em&gt;Pista&lt;/em&gt; (queda registrado en tus estadísticas).&lt;/p&gt;&lt;/div&gt;\n  &lt;p&gt;Tu primera flag es: &lt;span class=\&quot;flagtxt\&quot;&gt;PRIV{pura_vida_con_privacidad}&lt;/span&gt;&lt;/p&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;1.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;Lee el briefing completo y envía la flag de bienvenida.&quot;,&quot;fmt&quot;:&quot;PRIV{...}&quot;,&quot;hint&quot;:&quot;Está al final del briefing, resaltada en verde.&quot;,&quot;h&quot;:[&quot;2402500994323900&quot;]},{&quot;id&quot;:&quot;1.2&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Qué número tiene la ley costarricense de Protección de la Persona frente al Tratamiento de sus Datos Personales?&quot;,&quot;fmt&quot;:&quot;Número&quot;,&quot;hint&quot;:&quot;Son cuatro dígitos; aparece en la diapositiva del fundamento legal.&quot;,&quot;h&quot;:[&quot;2612748702361653&quot;,&quot;4458750979788203&quot;,&quot;7249380949011657&quot;,&quot;8628494829681453&quot;]}]},{&quot;id&quot;:&quot;t2&quot;,&quot;color&quot;:&quot;#a78bfa&quot;,&quot;title&quot;:&quot;Marco legal: Ley 8968, PRODHAB y derechos ARCO&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;Antes de auditar, necesitas dominar el marco legal. Durante la semana llegaron tres solicitudes de vecinos a la municipalidad. Identifica qué derecho está ejerciendo cada persona.&lt;/p&gt;\n  &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Solicitud recibida&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;S-01&lt;/td&gt;&lt;td&gt;Doña Rosa cerró su cuenta en el sistema de trámites en línea y pide que &lt;strong&gt;se eliminen todos sus datos&lt;/strong&gt;.&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;S-02&lt;/td&gt;&lt;td&gt;Don Luis detectó que su número de teléfono &lt;strong&gt;está mal escrito&lt;/strong&gt; en su expediente y pide corregirlo.&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;S-03&lt;/td&gt;&lt;td&gt;Un vecino quiere &lt;strong&gt;saber qué datos suyos guarda&lt;/strong&gt; la municipalidad y para qué los usa.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;2.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Cuáles son las siglas de la agencia costarricense que recibe denuncias y fiscaliza bases de datos?&quot;,&quot;fmt&quot;:&quot;Siglas&quot;,&quot;hint&quot;:&quot;Agencia de Protección de Datos de los Habitantes.&quot;,&quot;h&quot;:[&quot;5001189576891483&quot;]},{&quot;id&quot;:&quot;2.2&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué número de reglamento complementa la Ley 8968 y detalla su aplicación práctica?&quot;,&quot;fmt&quot;:&quot;#####-XX&quot;,&quot;hint&quot;:&quot;Cinco dígitos, guion y las siglas del ministerio (Justicia y Paz).&quot;,&quot;h&quot;:[&quot;2278949627833739&quot;,&quot;1137226385217761&quot;,&quot;7526729582843311&quot;,&quot;4382726287220777&quot;]},{&quot;id&quot;:&quot;2.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Solicitud S-01: ¿qué derecho ejerce doña Rosa?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Es la “C” de ARCO.&quot;,&quot;h&quot;:[&quot;531492763621083&quot;,&quot;1035218842014435&quot;]},{&quot;id&quot;:&quot;2.4&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Solicitud S-02: ¿qué derecho ejerce don Luis?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Es la “R” de ARCO.&quot;,&quot;h&quot;:[&quot;2526319103314947&quot;,&quot;5100070489427520&quot;]},{&quot;id&quot;:&quot;2.5&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Solicitud S-03: ¿qué derecho ejerce el vecino?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Es la “A” de ARCO.&quot;,&quot;h&quot;:[&quot;4996304726096506&quot;,&quot;952010682798370&quot;]}]},{&quot;id&quot;:&quot;t3&quot;,&quot;color&quot;:&quot;#fb7185&quot;,&quot;title&quot;:&quot;Clasificación: el expediente VV-2026-0117&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;El departamento de becas te envió un expediente para revisar. Según la normativa costarricense, los datos personales se agrupan en &lt;strong&gt;identificativos, de contacto, sensibles y financieros&lt;/strong&gt;. Usa el clasificador: si aciertas los 10 campos se desbloquea una flag.&lt;/p&gt;\n  &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;Campo&lt;/th&gt;&lt;th&gt;Valor (ficticio)&lt;/th&gt;&lt;th&gt;Categoría&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F1&lt;/td&gt;&lt;td&gt;Nombre completo&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;Ana Lucía Ficticia Mora&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&g ;&lt;td&gt;Dirección&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;Barrio Ficticio, 200 m norte del parque&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F6&lt;/td&gt;&lt;td&gt;Diagnóstico médico&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;Asma crónica&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F7&lt;/td&gt;&lt;td&gt;Religión declarada&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;Registrada en formulario de becas&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F8&lt;/td&gt;&lt;td&gt;Origen étnico declarado&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;Registrado en formulario de becas&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F9&lt;/td&gt;&lt;td&gt;Cuenta IBAN&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;CR00 0000 0000 0000 0000 00&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;F10&lt;/td&gt;&lt;td&gt;Ingreso mensual del hogar&lt;/td&gt;&lt;td class=\&quot;m\&quot;&gt;₡ 650 000&lt;/td&gt;\n  &lt;td&gt;&lt;select class=\&quot;cls\&quot;&gt;&lt;option value=\&quot;\&quot;&gt;— elegir —&lt;/option&gt;&lt;option value=\&quot;I\&quot;&gt;Identificativo&lt;/option&gt;&lt;option value=\&quot;C\&quot;&gt;Contacto&lt;/option&gt;&lt;option value=\&quot;S\&quot;&gt;Sensible&lt;/option&gt;&lt;option value=\&quot;F\&quot;&gt;Financiero&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n  &lt;div style=\&quot;display:flex;gap:12px;align-items:center;flex-wrap:wrap\&quot;&gt;&lt;button class=\&quot;btn\&quot; id=\&quot;clsCheck\&quot;&gt;Verificar clasificación&lt;/button&gt;&lt;span class=\&quot;mini\&quot;&gt;Los campos mal clasificados se marcan en rojo.&lt;/span&gt;&lt;/div&gt;\n  &lt;div id=\&quot;clsOut\&quot;&gt;&lt;/div&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;3.1&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Cuántos campos del expediente son &lt;strong&gt;datos sensibles&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Número&quot;,&quot;hint&quot;:&quot;Salud, religión y origen étnico están en la lista de datos sensibles de la lección.&quot;,&quot;h&quot;:[&quot;1625400197954681&quot;,&quot;5894637193206781&quot;]},{&quot;id&quot;:&quot;3.2&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Escribe los ID de los campos &lt;strong&gt;financieros&lt;/strong&gt;, en orden y separados por coma.&quot;,&quot;fmt&quot;:&quot;Ej.: F1,F2&quot;,&quot;hint&quot;:&quot;Busca información bancaria e ingresos.&quot;,&quot;h&quot;:[&quot;8489774869629185&quot;]},{&quot;id&quot;:&quot;3.3&quot;,&quot;pts&quot;:25,&quot;text&quot;:&quot;Clasifica correctamente los 10 campos y envía la flag que aparece.&quot;,&quot;fmt&quot;:&quot;PRIV{...}&quot;,&quot;hint&quot;:&quot;Nombre y cédula son identificativos; correo, teléfono y dirección son de contacto.&quot;,&quot;h&quot;:[&quot;348876294760238&quot;]}]},{&quot;id&quot;:&quot;t4&quot;,&quot;color&quot;:&quot;#38bdf8&quot;,&quot;title&quot;:&quot;Pseudonimizar vs. anonimizar&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;El área de estadística quiere publicar datos sobre el uso de la plataforma de trámites. Preparó dos conjuntos de datos y te pide decidir cuál puede publicarse sin quedar sujeto a la Ley 8968.&lt;/p&gt;\n  &lt;div class=\&quot;two\&quot;&gt;\n    &lt;div&gt;&lt;div class=\&quot;ds-title\&quot; style=\&quot;color:var(--sky)\&quot;&gt;DATASET A&lt;/div&gt;\n      &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;id_usuario&lt;/th&gt;&lt;th&gt;edad&lt;/th&gt;&lt;th&gt;cantón&lt;/th&gt;&lt;th&gt;trámites/mes&lt;/th&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;Usuario_789XYZ&lt;/td&gt;&lt;td&gt;34&lt;/td&gt;&lt;td&gt;Escazú&lt;/td&gt;&lt;td&gt;12&lt;/td&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;Usuario_412KLM&lt;/td&gt;&lt;td&gt;61&lt;/td&gt;&lt;td&gt;Cartago&lt;/td&gt;&lt;td&gt;4&lt;/td&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;Usuario_150QRS&lt;/td&gt;&lt;td&gt;27&lt;/td&gt;&lt;td&gt;Heredia&lt;/td&gt;&lt;td&gt;9&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n      &lt;div class=\&quot;box warn\&quot; style=\&quot;font-size:13px;margin-top:6px\&quot;&gt;📁 La tabla que relaciona cada &lt;code&gt;Usuario_XXX&lt;/code&gt; con el nombre y la cédula real se guarda en &lt;code&gt;llaves.csv&lt;/code&gt;, en otro servidor.&lt;/div&gt;\n    &lt;/div&gt;\n    &lt;div&gt;&lt;div class=\&quot;ds-title\&quot; style=\&quot;color:var(--teal)\&quot;&gt;DATASET B&lt;/div&gt;\n      &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;rango edad&lt;/th&gt;&lt;th&gt;provincia&lt;/th&gt;&lt;th&gt;personas&lt;/th&gt;&lt;th&gt;promedio/mes&lt;/th&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td&gt;20–29&lt;/td&gt;&lt;td&gt;Heredia&lt;/td&gt;&lt;td&gt;412&lt;/td&gt;&lt;td&gt;8,7&lt;/td&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td&gt;30–39&lt;/td&gt;&lt;td&gt;San José&lt;/td&gt;&lt;td&gt;538&lt;/td&gt;&lt;td&gt;10,2&lt;/td&gt;&lt;/tr&gt;\n      &lt;tr&gt;&lt;td&gt;60–69&lt;/td&gt;&lt;td&gt;Cartago&lt;/td&gt;&lt;td&gt;290&lt;/td&gt;&lt;td&gt;3,9&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n      &lt;div class=\&quot;box ok\&quot; style=\&quot;font-size:13px;margin-top:6px\&quot;&gt;Sin identificadores. No existe ninguna tabla que permita volver a la persona.&lt;/div&gt;\n    &lt;/div&gt;\n  &lt;/div&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;4.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Qué dataset está &lt;strong&gt;pseudonimizado&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;A o B&quot;,&quot;hint&quot;:&quot;La pseudonimización reemplaza identificadores por valores artificiales, pero es reversible.&quot;,&quot;h&quot;:[&quot;3755123279375241&quot;,&quot;2095341233404835&quot;]},{&quot;id&quot;:&quot;4.2&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Cuál dataset &lt;strong&gt;sigue siendo dato personal&lt;/strong&gt; sujeto a la Ley 8968?&quot;,&quot;fmt&quot;:&quot;A o B&quot;,&quot;hint&quot;:&quot;Si existe forma de reidentificar a la persona, sigue siendo dato personal.&quot;,&quot;h&quot;:[&quot;3287266334994410&quot;,&quot;4712728368124634&quot;]},{&quot;id&quot;:&quot;4.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Convertir la edad 34 en el rango “30–39” es una técnica de anonimización llamada…&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Hace el dato menos preciso, más “general”.&quot;,&quot;h&quot;:[&quot;1753226777070228&quot;,&quot;1053160176295723&quot;]},{&quot;id&quot;:&quot;4.4&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Reportar promedios de cientos de personas en lugar de filas individuales se conoce como…&quot;,&quot;fmt&quot;:&quot;Una o dos palabras&quot;,&quot;hint&quot;:&quot;Es la tercera técnica de la lista de anonimización.&quot;,&quot;h&quot;:[&quot;8387210610739163&quot;,&quot;8180563088702821&quot;,&quot;8799095041862883&quot;]},{&quot;id&quot;:&quot;4.5&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué archivo permitiría revertir los pseudónimos del dataset A y por eso debe protegerse aparte?&quot;,&quot;fmt&quot;:&quot;nombre.extensión&quot;,&quot;hint&quot;:&quot;Lee el recuadro amarillo debajo del dataset A.&quot;,&quot;h&quot;:[&quot;4445469509296122&quot;]}]},{&quot;id&quot;:&quot;t5&quot;,&quot;color&quot;:&quot;#fbbf24&quot;,&quot;title&quot;:&quot;Cifrado: ¿protegido o solo disfrazado?&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;La municipalidad asegura que “todo está cifrado”. Verifica qué tipo de protección aplica en cada caso y revisa una nota que un practicante dice haber “cifrado”.&lt;/p&gt;\n  &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;Caso&lt;/th&gt;&lt;th&gt;Situación&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;C-1&lt;/td&gt;&lt;td&gt;El portal de pagos municipales usa &lt;strong&gt;HTTPS&lt;/strong&gt; cuando el vecino envía sus datos.&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;C-2&lt;/td&gt;&lt;td&gt;Los &lt;strong&gt;discos&lt;/strong&gt; del servidor de expedientes están cifrados.&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td class=\&quot;m\&quot;&gt;C-3&lt;/td&gt;&lt;td&gt;El equipo de respuesta usa una app en la que &lt;strong&gt;solo el emisor y el receptor&lt;/strong&gt; pueden leer los mensajes.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n  &lt;h4&gt;📝 Nota “cifrada” del practicante&lt;/h4&gt;\n  &lt;div class=\&quot;b64\&quot;&gt;Tm90YSBkZWwgcHJhY3RpY2FudGU6IGVzdG8gTk8gZXN0YSBjaWZyYWRvLCBzb2xvIGNvZGlmaWNhZG8gZW4gQmFzZTY0LiBDdWFscXVpZXJhIHB1ZWRlIGxlZXJsbyBzaW4gdW5hIGNsYXZlLiBQUklWe2MwZDFmMWM0cl9uMF8zc19jMWZyNHJ9&lt;/div&gt;\n  &lt;p class=\&quot;mini\&quot; style=\&quot;margin-top:8px\&quot;&gt;Copia el texto y usa el decodificador Base64 de la caja de herramientas (panel derecho).&lt;/p&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;5.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;Caso C-1: ¿qué tipo de cifrado es?&quot;,&quot;fmt&quot;:&quot;en ______&quot;,&quot;hint&quot;:&quot;Protege los datos mientras viajan por la red.&quot;,&quot;h&quot;:[&quot;6173740585108306&quot;,&quot;2101438779145951&quot;,&quot;2218414740033007&quot;]},{&quot;id&quot;:&quot;5.2&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;Caso C-2: ¿qué tipo de cifrado es?&quot;,&quot;fmt&quot;:&quot;en ______&quot;,&quot;hint&quot;:&quot;Protege los datos almacenados.&quot;,&quot;h&quot;:[&quot;6263562933575131&quot;,&quot;4576626501911607&quot;,&quot;6418735561101246&quot;]},{&quot;id&quot;:&quot;5.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Caso C-3: ¿qué tipo de cifrado usa la app del equipo?&quot;,&quot;fmt&quot;:&quot;de ______ a ______&quot;,&quot;hint&quot;:&quot;Ejemplo típico: Signal.&quot;,&quot;h&quot;:[&quot;7669511946270665&quot;,&quot;2238860133070472&quot;,&quot;6397173212250855&quot;,&quot;5886207523949612&quot;,&quot;592087169761013&quot;]},{&quot;id&quot;:&quot;5.4&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Según la lección, ¿qué algoritmo implementó el BCCR en 2023 para el Sistema de Pagos de Bajo Valor?&quot;,&quot;fmt&quot;:&quot;ALGORITMO-BITS&quot;,&quot;hint&quot;:&quot;Advanced Encryption Standard con clave de 256 bits.&quot;,&quot;h&quot;:[&quot;8643500042544520&quot;,&quot;3260952479474070&quot;,&quot;3321615708493369&quot;]},{&quot;id&quot;:&quot;5.5&quot;,&quot;pts&quot;:25,&quot;text&quot;:&quot;Decodifica la nota del practicante y envía la flag que contiene.&quot;,&quot;fmt&quot;:&quot;PRIV{...}&quot;,&quot;hint&quot;:&quot;Pega el texto morado en la caja de herramientas y pulsa “Decodificar”.&quot;,&quot;h&quot;:[&quot;2587537784219619&quot;]}]},{&quot;id&quot;:&quot;t6&quot;,&quot;color&quot;:&quot;#f472b6&quot;,&quot;title&quot;:&quot;Consentimiento: la app RutaCR de TechCR S.A.&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;La municipalidad evalúa firmar un convenio con &lt;strong&gt;TechCR S.A.&lt;/strong&gt; (empresa ficticia del ejemplo de clase) para usar su app de transporte &lt;strong&gt;RutaCR&lt;/strong&gt;. Antes, te piden revisar la pantalla de registro. Recuerda: el consentimiento válido debe ser &lt;strong&gt;libre, específico, informado e inequívoco&lt;/strong&gt;.&lt;/p&gt;\n  &lt;div class=\&quot;phone\&quot;&gt;&lt;div class=\&quot;screen\&quot;&gt;\n    &lt;div class=\&quot;app\&quot;&gt;&lt;i&gt;&lt;/i&gt;RutaCR&lt;/div&gt;&lt;div class=\&quot;sub\&quot;&gt;Crea tu cuenta · TechCR S.A.&lt;/div&gt;\n    &lt;div class=\&quot;fld\&quot;&gt;Nombre completo&lt;/div&gt;&lt;div class=\&quot;fld\&quot;&gt;Correo electrónico&lt;/div&gt;\n    &lt;div class=\&quot;cl\&quot;&gt;&lt;b&gt;C1&lt;/b&gt;&lt;span class=\&quot;cb\&quot;&gt;✓&lt;/span&gt;&lt;span&gt;Acepto recibir publicidad personalizada según mi ubicación. &lt;em&gt;(casilla marcada por defecto)&lt;/em&gt;&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=\&quot;cl\&quot;&gt;&lt;b&gt;C2&lt;/b&gt;&lt;span&gt;Para crear tu cuenta debes aceptar compartir tu ubicación con nuestros socios comerciales. Sin esto no podrás usar la app.&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=\&quot;cl\&quot;&gt;&lt;b&gt;C3&lt;/b&gt;&lt;span&gt;Tus datos podrán usarse para cualquier fin que TechCR considere útil, ahora o en el futuro.&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=\&quot;cl\&quot;&gt;&lt;b&gt;C4&lt;/b&gt;&lt;span&gt;Los detalles del tratamiento están en el documento interno TCR-77, disponible solo para empleados.&lt;/span&gt;&lt;/div&gt;\n    &lt;div class=\&quot;go\&quot;&gt;Crear cuenta&lt;/div&gt;\n  &lt;/div&gt;&lt;/div&gt;\n  &lt;p class=\&quot;mini\&quot; style=\&quot;text-align:center\&quot;&gt;Dato adicional: la app registra la ubicación cada 5 segundos, aunque solo la necesita al solicitar un viaje.&lt;/p&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;6.1&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué característica del consentimiento válido incumple la cláusula &lt;strong&gt;C1&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Una casilla pre-marcada no es una manifestación clara de voluntad.&quot;,&quot;h&quot;:[&quot;5070572087740503&quot;,&quot;7412918064358554&quot;]},{&quot;id&quot;:&quot;6.2&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué característica incumple la cláusula &lt;strong&gt;C2&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Condiciona el servicio: hay presión para aceptar.&quot;,&quot;h&quot;:[&quot;4592475505075340&quot;]},{&quot;id&quot;:&quot;6.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué característica incumple la cláusula &lt;strong&gt;C3&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;No declara finalidades concretas.&quot;,&quot;h&quot;:[&quot;3260672238577170&quot;,&quot;3135570858654035&quot;]},{&quot;id&quot;:&quot;6.4&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué característica incumple la cláusula &lt;strong&gt;C4&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;El usuario no puede conocer cómo se tratarán sus datos.&quot;,&quot;h&quot;:[&quot;2319461778125240&quot;,&quot;4946876827739023&quot;]},{&quot;id&quot;:&quot;6.5&quot;,&quot;pts&quot;:20,&quot;text&quot;:&quot;Registrar la ubicación cada 5 segundos aunque solo se necesita al pedir un viaje viola principalmente el principio de…&quot;,&quot;fmt&quot;:&quot;Una o dos palabras&quot;,&quot;hint&quot;:&quot;“Recolectar solo lo necesario.”&quot;,&quot;h&quot;:[&quot;3690673201414192&quot;,&quot;6646963016073105&quot;,&quot;7740927437786546&quot;,&quot;3541652696306523&quot;]}]},{&quot;id&quot;:&quot;t7&quot;,&quot;color&quot;:&quot;#38bdf8&quot;,&quot;title&quot;:&quot;Respuesta a incidente: la bitácora de Valle Verde&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;Un respaldo de la base de datos de ciudadanos quedó accesible al público por error. Revisa la bitácora del incidente (ficticia) y responde como analista del equipo de respuesta.&lt;/p&gt;\n  &lt;div class=\&quot;log\&quot;&gt;&lt;span class=\&quot;t\&quot;&gt;[2026-02-03 08:12]&lt;/span&gt; &lt;span class=\&quot;ops\&quot;&gt;OPS&lt;/span&gt;  Respaldo \&quot;ciudadanos_bk.sql\&quot; copiado al servidor web de pruebas (acceso público habilitado por error)\n&lt;span class=\&quot;t\&quot;&gt;[2026-02-03 08:15]&lt;/span&gt; &lt;span class=\&quot;ops\&quot;&gt;OPS&lt;/span&gt;  Ticket de limpieza INC-0117 creado · sin responsable asignado\n&lt;span class=\&quot;t\&quot;&gt;[2026-03-18 14:40]&lt;/span&gt; &lt;span class=\&quot;sec\&quot;&gt;SEC&lt;/span&gt;  Revisión periódica de procedimientos (trimestral) pospuesta por falta de personal\n&lt;span class=\&quot;t\&quot;&gt;[2026-05-14 09:05]&lt;/span&gt; &lt;span class=\&quot;ext\&quot;&gt;EXT&lt;/span&gt;  Investigador externo reporta que el respaldo es accesible públicamente\n&lt;span class=\&quot;t\&quot;&gt;[2026-05-14 09:30]&lt;/span&gt; &lt;span class=\&quot;sec\&quot;&gt;SEC&lt;/span&gt;  Archivo retirado del servidor · se preserva evidencia\n&lt;span class=\&quot;t\&quot;&gt;[2026-05-15 08:00]&lt;/span&gt; &lt;span class=\&quot;sec\&quot;&gt;SEC&lt;/span&gt;  Inicia auditoría completa de seguridad\n&lt;span class=\&quot;t\&quot;&gt;[2026-05-15 11:20]&lt;/span&gt; &lt;span class=\&quot;sec\&quot;&gt;SEC&lt;/span&gt;  Hallazgo: el respaldo NO estaba cifrado\n&lt;span class=\&quot;t\&quot;&gt;[2026-05-20 10:00]&lt;/span&gt; &lt;span class=\&quot;leg\&quot;&gt;LEG&lt;/span&gt;  Notificación enviada a 52.340 personas afectadas y a la PRODHAB\n&lt;span class=\&quot;t\&quot;&gt;[2026-06-02 16:00]&lt;/span&gt; &lt;span class=\&quot;sec\&quot;&gt;SEC&lt;/span&gt;  Nuevos protocolos de acceso aprobados · código de cierre: PRIV{m0n1t0r30_c0nt1nu0}&lt;/div&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;7.1&quot;,&quot;pts&quot;:20,&quot;text&quot;:&quot;¿Cuántos días estuvo expuesto el respaldo (del 3 de febrero al 14 de mayo de 2026)?&quot;,&quot;fmt&quot;:&quot;Número&quot;,&quot;hint&quot;:&quot;Febrero de 2026 tiene 28 días. Cuenta de 03-feb a 14-may.&quot;,&quot;h&quot;:[&quot;4827456036012726&quot;,&quot;3622449476856806&quot;]},{&quot;id&quot;:&quot;7.2&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Cuántas personas fueron notificadas?&quot;,&quot;fmt&quot;:&quot;Número sin separadores&quot;,&quot;hint&quot;:&quot;Busca la línea marcada como LEG.&quot;,&quot;h&quot;:[&quot;8449659073735582&quot;]},{&quot;id&quot;:&quot;7.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué medida técnica, ausente según la bitácora, habría protegido el contenido aunque alguien descargara el archivo?&quot;,&quot;fmt&quot;:&quot;Palabra o frase corta&quot;,&quot;hint&quot;:&quot;Revisa el hallazgo del 15 de mayo a las 11:20.&quot;,&quot;h&quot;:[&quot;5132632049247650&quot;,&quot;13356332724169&quot;,&quot;4158087657260103&quot;,&quot;7002481854239027&quot;,&quot;4074678682385527&quot;,&quot;7194848798050451&quot;]},{&quot;id&quot;:&quot;7.4&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Qué práctica, señalada como lección aprendida en el caso real de 2021, habría detectado la exposición mucho antes?&quot;,&quot;fmt&quot;:&quot;Dos palabras&quot;,&quot;hint&quot;:&quot;Es la primera “lección aprendida” del caso de filtración de datos públicos.&quot;,&quot;h&quot;:[&quot;2627565810512163&quot;,&quot;4907069161237920&quot;,&quot;8741277964190543&quot;]},{&quot;id&quot;:&quot;7.5&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;La revisión pospuesta del 18 de marzo corresponde a un tipo de auditoría. ¿Cuál?&quot;,&quot;fmt&quot;:&quot;interna / externa / técnica&quot;,&quot;hint&quot;:&quot;“Revisión periódica de procedimientos.”&quot;,&quot;h&quot;:[&quot;7320688948814944&quot;,&quot;2812829526674448&quot;]},{&quot;id&quot;:&quot;7.6&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;Envía el código de cierre del incidente.&quot;,&quot;fmt&quot;:&quot;PRIV{...}&quot;,&quot;hint&quot;:&quot;Última línea de la bitácora.&quot;,&quot;h&quot;:[&quot;450502313683565&quot;]}]},{&quot;id&quot;:&quot;t8&quot;,&quot;color&quot;:&quot;#4ade80&quot;,&quot;title&quot;:&quot;Higiene digital: la auditoría personal de Diego&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;Diego, compañero de la Unidad, te pidió revisar su higiene digital. Este es el resumen de sus cuentas (ficticio):&lt;/p&gt;\n  &lt;table class=\&quot;data\&quot;&gt;&lt;tr&gt;&lt;th&gt;Servicio&lt;/th&gt;&lt;th&gt;¿Contraseña única?&lt;/th&gt;&lt;th&gt;¿2FA activo?&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Correo personal&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;td class=\&quot;yes\&quot;&gt;Sí&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Banca en línea&lt;/td&gt;&lt;td class=\&quot;yes\&quot;&gt;Sí&lt;/td&gt;&lt;td class=\&quot;yes\&quot;&gt;Sí&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Red social&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Tienda en línea&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Plataforma del trabajo&lt;/td&gt;&lt;td class=\&quot;yes\&quot;&gt;Sí&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Streaming&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;td class=\&quot;no\&quot;&gt;No&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;\n  &lt;div class=\&quot;box\&quot;&gt;Diego también llenó el checklist de autoevaluación de la clase:&lt;br&gt;\n  ✗ Contraseñas únicas para cada servicio &amp;nbsp;·&amp;nbsp; ✗ 2FA activado &amp;nbsp;·&amp;nbsp; ✓ Revisa configuraciones de privacidad &amp;nbsp;·&amp;nbsp; ✗ Lee políticas antes de aceptar &amp;nbsp;·&amp;nbsp; ✓ Sabe qué datos suyos están en línea&lt;/div&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;8.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Cuántas cuentas de Diego &lt;strong&gt;reutilizan&lt;/strong&gt; contraseña?&quot;,&quot;fmt&quot;:&quot;Número&quot;,&quot;hint&quot;:&quot;Cuenta los “No” en la columna de contraseña única.&quot;,&quot;h&quot;:[&quot;7380559313074703&quot;,&quot;5697112575281465&quot;]},{&quot;id&quot;:&quot;8.2&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;¿Cuántas cuentas no tienen &lt;strong&gt;ni&lt;/strong&gt; contraseña única &lt;strong&gt;ni&lt;/strong&gt; 2FA?&quot;,&quot;fmt&quot;:&quot;Número&quot;,&quot;hint&quot;:&quot;Busca las filas con “No” en ambas columnas.&quot;,&quot;h&quot;:[&quot;1307949429647186&quot;,&quot;6863145133100920&quot;]},{&quot;id&quot;:&quot;8.3&quot;,&quot;pts&quot;:15,&quot;text&quot;:&quot;Con su checklist, ¿qué nivel obtiene Diego según la escala de la lección?&quot;,&quot;fmt&quot;:&quot;Una palabra&quot;,&quot;hint&quot;:&quot;Obtuvo 2/5. Escala: 5 excelente · 3–4 bueno · 1–2 … · 0 alto riesgo.&quot;,&quot;h&quot;:[&quot;4760295197713474&quot;,&quot;5834722688104818&quot;]},{&quot;id&quot;:&quot;8.4&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Qué gestor de contraseñas destaca la lección como &lt;strong&gt;de código abierto&lt;/strong&gt;?&quot;,&quot;fmt&quot;:&quot;Nombre&quot;,&quot;hint&quot;:&quot;Es el número 1 de la lista de gestores recomendados.&quot;,&quot;h&quot;:[&quot;5359045057979431&quot;]}]},{&quot;id&quot;:&quot;t9&quot;,&quot;color&quot;:&quot;#a78bfa&quot;,&quot;title&quot;:&quot;Herramientas y flag final&quot;,&quot;content&quot;:&quot;\n  &lt;p&gt;Último paso: la alcaldía quiere una guía rápida de herramientas para el personal. Responde y luego busca la flag final.&lt;/p&gt;\n  &lt;div class=\&quot;box warn\&quot;&gt;🔎 &lt;strong&gt;Pista de campo:&lt;/strong&gt; los buenos analistas revisan los detalles, incluso los que no se ven. La transparencia también aplica a esta misma sala: inspecciona su &lt;strong&gt;código fuente&lt;/strong&gt; (clic derecho → “Ver código fuente de la página”, o &lt;code&gt;Ctrl+U&lt;/code&gt; / &lt;code&gt;⌘+Option+U&lt;/code&gt;).&lt;/div&gt;&quot;,&quot;questions&quot;:[{&quot;id&quot;:&quot;9.1&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Qué app de mensajería ubica la lección en el “máximo nivel de seguridad”?&quot;,&quot;fmt&quot;:&quot;Nombre&quot;,&quot;hint&quot;:&quot;Su ícono es un globo de diálogo azul.&quot;,&quot;h&quot;:[&quot;7806090816850645&quot;]},{&quot;id&quot;:&quot;9.2&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;¿Qué navegador recomienda la lección para anonimato extremo?&quot;,&quot;fmt&quot;:&quot;Nombre&quot;,&quot;hint&quot;:&quot;Funciona sobre una red de “cebolla”.&quot;,&quot;h&quot;:[&quot;6596937906928148&quot;,&quot;3878943734435349&quot;,&quot;6382277972928936&quot;]},{&quot;id&quot;:&quot;9.3&quot;,&quot;pts&quot;:10,&quot;text&quot;:&quot;Verdadero o falso: el modo incógnito te vuelve anónimo en internet.&quot;,&quot;fmt&quot;:&quot;verdadero / falso&quot;,&quot;hint&quot;:&quot;Solo evita guardar el historial en tu equipo.&quot;,&quot;h&quot;:[&quot;7092319142519909&quot;,&quot;7550867571810060&quot;,&quot;7210509221577975&quot;]},{&quot;id&quot;:&quot;9.4&quot;,&quot;pts&quot;:30,&quot;text&quot;:&quot;Envía la flag oculta en el código fuente de esta sala.&quot;,&quot;fmt&quot;:&quot;PRIV{...}&quot;,&quot;hint&quot;:&quot;Está en un comentario HTML al inicio del &amp;lt;body&amp;gt;.&quot;,&quot;h&quot;:[&quot;8520861832001937&quot;]}]}];
const CLS_EXPECTED = &#x27;IICCCSSSFF&#x27;;
const CLS_FLAG_B64 = &#x27;UFJJVntzM25zMWJsM3NfYzBuX2x1cDR9&#x27;;
const SALT = 606;

function cyrb53(str, seed){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0, ch; i &lt; str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 &gt;&gt;&gt; 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 &gt;&gt;&gt; 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 &gt;&gt;&gt; 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 &gt;&gt;&gt; 13), 3266489909);
  return 4294967296 * (2097151 &amp; h2) + (h1 &gt;&gt;&gt; 0);
}
const norm = s =&gt; String(s).normalize(&#x27;NFD&#x27;).replace(/[̀-ͯ]/g,&#x27;&#x27;).toLowerCase().trim().replace(/^[&quot;&#x27;`]+|[&quot;&#x27;`.]+$/g,&#x27;&#x27;).replace(/\s+/g,&#x27; &#x27;).replace(/\s*,\s*/g,&#x27;,&#x27;);
const keyOf = (qid, a) =&gt; String(cyrb53(qid + &#x27;|&#x27; + norm(a), SALT));

const STORE = &#x27;cy606-s11-ctf-v1&#x27;;
let state = {solved:{}, hints:{}, fails:0, notes:&#x27;&#x27;, open:&#x27;t1&#x27;, name:&#x27;&#x27;};
try { const raw = localStorage.getItem(STORE); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e) {}
const save = () =&gt; { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} };

const allQ = ROOM.flatMap(t =&gt; t.questions);
const totalPts = allQ.reduce((a,q) =&gt; a + q.pts, 0);
const $ = id =&gt; document.getElementById(id);

function render(){
  const root = $(&#x27;tasks&#x27;);
  root.innerHTML = &#x27;&#x27;;
  ROOM.forEach((t, ti) =&gt; {
    const sec = document.createElement(&#x27;section&#x27;);
    sec.className = &#x27;task&#x27;;
    sec.id = t.id;
    sec.style.setProperty(&#x27;--c&#x27;, t.color);
    sec.innerHTML = `
      &lt;button class=&quot;task-hd&quot;&gt;&lt;span class=&quot;tnum&quot;&gt;Tarea ${ti+1}&lt;/span&gt;&lt;span class=&quot;ttitle&quot;&gt;${t.title}&lt;/span&gt;&lt;span class=&quot;tprog&quot;&gt;&lt;/span&gt;&lt;span class=&quot;chev&quot;&gt;▾&lt;/span&gt;&lt;/button&gt;
      &lt;div class=&quot;task-body&quot;&gt;&lt;div class=&quot;content&quot;&gt;${t.content}&lt;/div&gt;&lt;div class=&quot;qs&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
    const qs = sec.querySelector(&#x27;.qs&#x27;);
    t.questions.forEach(q =&gt; {
      const d = document.createElement(&#x27;div&#x27;);
      d.className = &#x27;q&#x27;;
      d.dataset.id = q.id;
      d.innerHTML = `
        &lt;div class=&quot;qtext&quot;&gt;&lt;span class=&quot;qn&quot;&gt;${q.id}&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;${q.text}&lt;/span&gt;&lt;span class=&quot;ptsb&quot;&gt;${q.pts} pts&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;qrow&quot;&gt;&lt;input type=&quot;text&quot; spellcheck=&quot;false&quot; autocomplete=&quot;off&quot; placeholder=&quot;${q.fmt}&quot;&gt;&lt;button class=&quot;btn ghost hb&quot;&gt;Pista&lt;/button&gt;&lt;button class=&quot;btn sb&quot;&gt;Enviar&lt;/button&gt;&lt;/div&gt;
        &lt;div class=&quot;hinttext&quot;&gt;💡 ${q.hint}&lt;/div&gt;
        &lt;div class=&quot;msg&quot;&gt;&lt;/div&gt;`;
      const inp = d.querySelector(&#x27;input&#x27;), msg = d.querySelector(&#x27;.msg&#x27;);
      const submit = () =&gt; {
        if (state.solved[q.id]) return;
        const v = inp.value;
        if (!v.trim()) return;
        if (q.h.includes(keyOf(q.id, v))) {
          state.solved[q.id] = v.trim();
          save(); refresh();
          msg.className = &#x27;msg ok&#x27;; msg.textContent = &#x27;✓ ¡Correcto! +&#x27; + q.pts + &#x27; pts&#x27;;
          maybeFinish();
        } else {
          state.fails++; save(); refresh();
          msg.className = &#x27;msg bad&#x27;; msg.textContent = &#x27;✗ Respuesta incorrecta. Revisa el formato e inténtalo de nuevo.&#x27;;
          d.classList.remove(&#x27;shake&#x27;); void d.offsetWidth; d.classList.add(&#x27;shake&#x27;);
        }
      };
      d.querySelector(&#x27;.sb&#x27;).onclick = submit;
      inp.addEventListener(&#x27;keydown&#x27;, e =&gt; { if (e.key === &#x27;Enter&#x27;) submit(); });
      d.querySelector(&#x27;.hb&#x27;).onclick = () =&gt; {
        d.querySelector(&#x27;.hinttext&#x27;).classList.add(&#x27;show&#x27;);
        if (!state.hints[q.id]) { state.hints[q.id] = 1; save(); refresh(); }
      };
      if (state.hints[q.id]) d.querySelector(&#x27;.hinttext&#x27;).classList.add(&#x27;show&#x27;);
      qs.appendChild(d);
    });
    sec.querySelector(&#x27;.task-hd&#x27;).onclick = () =&gt; {
      const willOpen = !sec.classList.contains(&#x27;open&#x27;);
      document.querySelectorAll(&#x27;.task.open&#x27;).forEach(x =&gt; x.classList.remove(&#x27;open&#x27;));
      if (willOpen) { sec.classList.add(&#x27;open&#x27;); state.open = t.id; sec.scrollIntoView({behavior:&#x27;smooth&#x27;, block:&#x27;start&#x27;}); }
      else state.open = &#x27;&#x27;;
      save();
    };
    if (state.open === t.id) sec.classList.add(&#x27;open&#x27;);
    root.appendChild(sec);
  });
  wireTaskWidgets();
  refresh();
}

function refresh(){
  let pts = 0, solvedN = 0, tasksDone = 0;
  ROOM.forEach(t =&gt; {
    const sec = $(t.id);
    let n = 0;
    t.questions.forEach(q =&gt; {
      const d = sec.querySelector(`.q[data-id=&quot;${q.id}&quot;]`);
      if (state.solved[q.id]) {
        n++; pts += q.pts; solvedN++;
        d.classList.add(&#x27;solved&#x27;);
        const inp = d.querySelector(&#x27;input&#x27;);
        inp.value = state.solved[q.id]; inp.readOnly = true;
        d.querySelector(&#x27;.sb&#x27;).textContent = &#x27;✓&#x27;;
        const m = d.querySelector(&#x27;.msg&#x27;); if (!m.textContent) { m.className = &#x27;msg ok&#x27;; m.textContent = &#x27;✓ Resuelta&#x27;; }
      }
    });
    sec.querySelector(&#x27;.tprog&#x27;).textContent = n + &#x27;/&#x27; + t.questions.length;
    const done = n === t.questions.length;
    sec.classList.toggle(&#x27;done&#x27;, done);
    if (done) tasksDone++;
  });
  const pct = Math.round(solvedN / allQ.length * 100);
  $(&#x27;pts&#x27;).textContent = pts; $(&#x27;ptsMax&#x27;).textContent = totalPts;
  $(&#x27;solvedN&#x27;).textContent = solvedN; $(&#x27;totalN&#x27;).textContent = allQ.length;
  $(&#x27;pct&#x27;).textContent = pct + &#x27;%&#x27;;
  $(&#x27;ringVal&#x27;).style.strokeDashoffset = 100 - pct;
  $(&#x27;stTasks&#x27;).textContent = tasksDone + &#x27;/&#x27; + ROOM.length;
  $(&#x27;stQ&#x27;).textContent = solvedN + &#x27;/&#x27; + allQ.length;
  $(&#x27;stHints&#x27;).textContent = Object.keys(state.hints).length;
  $(&#x27;stFails&#x27;).textContent = state.fails;
  $(&#x27;tagCount&#x27;).textContent = allQ.length + &#x27; preguntas&#x27;;
}

function maybeFinish(){
  const solvedN = allQ.filter(q =&gt; state.solved[q.id]).length;
  if (solvedN !== allQ.length) return;
  $(&#x27;cPts&#x27;).textContent = totalPts;
  $(&#x27;cHints&#x27;).textContent = Object.keys(state.hints).length;
  $(&#x27;cDate&#x27;).textContent = new Date().toLocaleDateString(&#x27;es-CR&#x27;);
  $(&#x27;nameIn&#x27;).value = state.name || &#x27;&#x27;;
  $(&#x27;certName&#x27;).textContent = state.name || &#x27;Tu nombre&#x27;;
  $(&#x27;modal&#x27;).classList.add(&#x27;show&#x27;);
  const colors = [&#x27;#2dd4bf&#x27;,&#x27;#a78bfa&#x27;,&#x27;#fbbf24&#x27;,&#x27;#fb7185&#x27;,&#x27;#38bdf8&#x27;,&#x27;#4ade80&#x27;];
  for (let i = 0; i &lt; 90; i++) {
    const c = document.createElement(&#x27;div&#x27;);
    c.className = &#x27;confetti&#x27;;
    c.style.left = Math.random()*100 + &#x27;vw&#x27;;
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (2.2 + Math.random()*2.2) + &#x27;s&#x27;;
    c.style.animationDelay = (Math.random()*.6) + &#x27;s&#x27;;
    document.body.appendChild(c);
    setTimeout(() =&gt; c.remove(), 5200);
  }
}

/* --- widgets dentro de las tareas --- */
function wireTaskWidgets(){
  const btn = document.getElementById(&#x27;clsCheck&#x27;);
  if (btn) btn.onclick = () =&gt; {
    const sels = [...document.querySelectorAll(&#x27;select.cls&#x27;)];
    let ok = 0;
    sels.forEach((s, i) =&gt; {
      const good = s.value === CLS_EXPECTED[i];
      s.classList.toggle(&#x27;good&#x27;, good); s.classList.toggle(&#x27;bad&#x27;, !good &amp;&amp; s.value !== &#x27;&#x27;);
      if (good) ok++;
    });
    const out = document.getElementById(&#x27;clsOut&#x27;);
    if (ok === sels.length) {
      out.className = &#x27;box ok&#x27;;
      out.innerHTML = &#x27;✓ Clasificación perfecta. Flag desbloqueada: &lt;span class=&quot;flagtxt&quot;&gt;&#x27; + atob(CLS_FLAG_B64) + &#x27;&lt;/span&gt;&#x27;;
    } else {
      out.className = &#x27;box warn&#x27;;
      out.textContent = ok + &#x27; de &#x27; + sels.length + &#x27; campos bien clasificados. Revisa los marcados en rojo o sin seleccionar.&#x27;;
    }
  };
}

/* --- caja de herramientas --- */
$(&#x27;b64dec&#x27;).onclick = () =&gt; {
  const v = $(&#x27;b64in&#x27;).value.replace(/\s+/g,&#x27;&#x27;);
  try {
    const bytes = Uint8Array.from(atob(v), c =&gt; c.charCodeAt(0));
    $(&#x27;b64out&#x27;).textContent = new TextDecoder().decode(bytes);
  } catch(e) { $(&#x27;b64out&#x27;).textContent = &#x27;⚠ No es Base64 válido.&#x27;; }
};
$(&#x27;b64enc&#x27;).onclick = () =&gt; {
  const bytes = new TextEncoder().encode($(&#x27;b64in&#x27;).value);
  let bin = &#x27;&#x27;; bytes.forEach(b =&gt; bin += String.fromCharCode(b));
  $(&#x27;b64out&#x27;).textContent = btoa(bin);
};
$(&#x27;notes&#x27;).value = state.notes || &#x27;&#x27;;
$(&#x27;notes&#x27;).addEventListener(&#x27;input&#x27;, e =&gt; { state.notes = e.target.value; save(); });
$(&#x27;reset&#x27;).onclick = () =&gt; {
  if (!window.confirm(&#x27;¿Borrar todo tu progreso en esta sala?&#x27;)) return;
  state = {solved:{}, hints:{}, fails:0, notes:&#x27;&#x27;, open:&#x27;t1&#x27;, name:&#x27;&#x27;};
  save(); $(&#x27;notes&#x27;).value = &#x27;&#x27;; render();
};
$(&#x27;nameIn&#x27;).addEventListener(&#x27;input&#x27;, e =&gt; { state.name = e.target.value; $(&#x27;certName&#x27;).textContent = e.target.value || &#x27;Tu nombre&#x27;; save(); });
$(&#x27;closeModal&#x27;).onclick = () =&gt; $(&#x27;modal&#x27;).classList.remove(&#x27;show&#x27;);
$(&#x27;modal&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; { if (e.target.id === &#x27;modal&#x27;) $(&#x27;modal&#x27;).classList.remove(&#x27;show&#x27;); });

render();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>

<script>
(function(){
  const frames={deck:document.getElementById('deck'),ctf:document.getElementById('ctf')};
  const btns=[...document.querySelectorAll('.seg button')];
  const fs=document.getElementById('fs'), kbd=document.getElementById('kbd');
  let cur='deck';
  function show(v){
    cur=v;
    btns.forEach(b=>b.classList.toggle('on',b.dataset.v===v));
    Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',k===v));
    fs.style.display=v==='deck'?'':'none'; kbd.style.display=v==='deck'?'':'none';
    try{history.replaceState(null,'','#'+(v==='deck'?'presentacion':'ctf'));}catch(e){}
    try{localStorage.setItem('cy606-s11-view',v);}catch(e){}
    setTimeout(()=>{try{frames[v].contentWindow.focus();}catch(e){}},60);
  }
  btns.forEach(b=>b.onclick=()=>show(b.dataset.v));
  window.addEventListener('message',e=>{if(e.data&&e.data.cy606==='ctf')show('ctf');});
  // si el foco queda en la barra superior, las flechas siguen moviendo la presentación
  document.addEventListener('keydown',e=>{
    if(cur!=='deck')return;
    const k=(e.key==='ArrowRight'||e.key==='PageDown')?'next':(e.key==='ArrowLeft'||e.key==='PageUp')?'prev':null;
    if(k){e.preventDefault();try{frames.deck.contentWindow.postMessage({cy606:'key',k},'*');}catch(err){}}
  });
  fs.onclick=()=>{const f=frames.deck; if(f.requestFullscreen)f.requestFullscreen(); else if(f.webkitRequestFullscreen)f.webkitRequestFullscreen(); setTimeout(()=>{try{f.contentWindow.focus();}catch(e){}},200);};
  let start=(location.hash==='#ctf')?'ctf':(location.hash==='#presentacion')?'deck':null;
  if(!start){try{start=localStorage.getItem('cy606-s11-view');}catch(e){}}
  show(start==='ctf'?'ctf':'deck');
})();
</script>
